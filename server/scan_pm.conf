[program:scan_pm]
command=/home/user/.doubao/agent_mode/workspace/bt_data/scan_pm_system.sh
directory=/home/user/.doubao/agent_mode/workspace/bt_data
user=user
autostart=true
autorestart=true
startsecs=6
startretries=999
priority=900
stdout_logfile=/home/user/.doubao/agent_mode/workspace/bt_data/scan_pm_system.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/home/user/.doubao/agent_mode/workspace/bt_data/scan_pm_system.err
redirect_stderr=true
