; 港股ETF看板 · 用户态 supervisord 保活配置
; 作用：托管 scan_pm.py --loop，崩溃/被环境杀掉后自动秒级重启；
;       容器重启后由每小时 cron 调用 scan_pm.py --ensure 把本 supervisord 重新拉起。

[unix_http_server]
file=/home/user/.doubao/agent_mode/workspace/bt_data/supervisor.sock
chmod=0700

[supervisord]
logfile=/home/user/.doubao/agent_mode/workspace/bt_data/supervisord.log
pidfile=/home/user/.doubao/agent_mode/workspace/bt_data/supervisord.pid
childlogdir=/home/user/.doubao/agent_mode/workspace/bt_data
nodaemon=false
logfile_maxbytes=10000000
logfile_backups=3
user=user

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/user/.doubao/agent_mode/workspace/bt_data/supervisor.sock

[program:scan_pm]
; 走自举脚本：已有 scan_pm --loop（系统托管或另一实例）时幂等退出，杜绝双开重复推送。
; startretries=3：系统托管正常时本 program 幂等秒退，几次后进 FATAL 不再反复刷日志；
; 容器重启后 supervisord 重新 autostart，此时无系统托管 loop，自举脚本真正起 loop。
command=/home/user/.doubao/agent_mode/workspace/bt_data/scan_pm_system.sh
directory=/home/user/.doubao/agent_mode/workspace/bt_data
autostart=true
autorestart=true
startsecs=6
startretries=3
stopwaitsecs=20
stopsignal=TERM
stdout_logfile=/home/user/.doubao/agent_mode/workspace/bt_data/scan_pm_loop.log
stdout_logfile_maxbytes=20000000
stdout_logfile_backups=5
redirect_stderr=true

[program:scan_watcher]
; 独立守护进程：探活 scan_pm --loop，不在/卡死即调 --ensure 拉起；订阅 ntfy 指令。
; 与 scan_pm 解耦：scan_pm 死后本进程仍在，可兜底拉起。崩溃由本 supervisord 秒级重启。
command=/opt/python3.12/bin/python3 scan_watcher.py --loop
directory=/home/user/.doubao/agent_mode/workspace/bt_data
autostart=true
autorestart=true
startsecs=6
startretries=999
stopwaitsecs=10
stopsignal=TERM
stdout_logfile=/home/user/.doubao/agent_mode/workspace/bt_data/watcher.log
stdout_logfile_maxbytes=10000000
stdout_logfile_backups=3
redirect_stderr=true
