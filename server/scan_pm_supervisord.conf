; 港股ETF看板 · 用户态 supervisord 保活配置
; 作用：托管 scan_pm.py --loop，崩溃/被环境杀掉后自动秒级重启；
;       容器重启后由每小时 cron 调用 scan_pm.py --ensure 把本 supervisord 重新拉起。

[unix_http_server]
file=/home/user/.doubao/agent_mode/workspace/bt_data/supervisor.sock
chmod=0700

[supervisord]
logfile=/home/user/.doubao/agent_mode/workspace/bt_data/supervisord.log
pidfile=/home/user/.doubao/agent_mode/workspace/bt_data/supervisord.pid
childlogdir=/home/user/.doubao/agent_mode/workspace/bt_data
nodaemon=false
logfile_maxbytes=10000000
logfile_backups=3
user=user

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/user/.doubao/agent_mode/workspace/bt_data/supervisor.sock

[program:scan_pm]
command=/opt/python3.12/bin/python3 scan_pm.py --loop
directory=/home/user/.doubao/agent_mode/workspace/bt_data
autostart=true
autorestart=true
startsecs=6
startretries=999
stopwaitsecs=20
stopsignal=TERM
stdout_logfile=/home/user/.doubao/agent_mode/workspace/bt_data/scan_pm_loop.log
stdout_logfile_maxbytes=20000000
stdout_logfile_backups=5
redirect_stderr=true
